---
- name: Verify Greengage DB installation
  hosts: all
  become: true

  tasks:
    - name: Gather package facts
      ansible.builtin.package_facts:
        manager: apt

    - name: Verify Greengage DB package
      ansible.builtin.assert:
        that:
          - "'greengange6' in ansible_facts.packages"
        fail_msg: "Greengage DB package greengange6 is not installed"

    - name: Check Greengage installation directory
      ansible.builtin.stat:
        path: /opt/greengagedb/greengage6
      register: greengage_install_dir

    - name: Verify Greengage installation directory
      ansible.builtin.assert:
        that:
          - greengage_install_dir.stat.exists
          - greengage_install_dir.stat.isdir

    - name: Check Greengage executable
      ansible.builtin.stat:
        path: /opt/greengagedb/greengage6/bin/psql
      register: greengage_psql

    - name: Verify Greengage executable
      ansible.builtin.assert:
        that:
          - greengage_psql.stat.exists
          - greengage_psql.stat.executable

    - name: Check Greengage environment script
      ansible.builtin.stat:
        path: /opt/greengagedb/greengage6/greengage_path.sh
      register: greengage_environment_script

    - name: Verify Greengage environment script
      ansible.builtin.assert:
        that:
          - greengage_environment_script.stat.exists
          - greengage_environment_script.stat.isreg

    - name: Check gpadmin account
      ansible.builtin.command:
        argv:
          - id
          - -un
          - gpadmin
      register: gpadmin_user
      changed_when: false

    - name: Verify gpadmin account
      ansible.builtin.assert:
        that:
          - gpadmin_user.stdout == 'gpadmin'

    - name: Check Greengage psql version
      ansible.builtin.command:
        argv:
          - /opt/greengagedb/greengage6/bin/psql
          - --version
      register: greengage_psql_version
      changed_when: false

    - name: Verify Greengage psql version output
      ansible.builtin.assert:
        that:
          - greengage_psql_version.rc == 0
          - "'psql' in greengage_psql_version.stdout"

    - name: Check gpadmin account entry
      ansible.builtin.command:
        argv:
          - getent
          - passwd
          - gpadmin
      register: gpadmin_passwd_entry
      changed_when: false

    - name: Verify gpadmin home directory
      ansible.builtin.assert:
        that:
          - gpadmin_passwd_entry.stdout.split(':') | length >= 7
          - gpadmin_passwd_entry.stdout.split(':')[5] == '/home/gpadmin'
        fail_msg: >-
          Expected gpadmin home directory /home/gpadmin.
          Actual passwd entry: {{ gpadmin_passwd_entry.stdout }}

    - name: Check Greengage initialization utility
      ansible.builtin.stat:
        path: /opt/greengagedb/greengage6/bin/gpinitsystem
      register: greengage_gpinitsystem

    - name: Verify Greengage initialization utility
      ansible.builtin.assert:
        that:
          - greengage_gpinitsystem.stat.exists
          - greengage_gpinitsystem.stat.executable
        fail_msg: "Greengage initialization utility is missing or not executable"

    - name: Check Greengage cluster status utility
      ansible.builtin.stat:
        path: /opt/greengagedb/greengage6/bin/gpstate
      register: greengage_gpstate

    - name: Verify Greengage cluster status utility
      ansible.builtin.assert:
        that:
          - greengage_gpstate.stat.exists
          - greengage_gpstate.stat.executable
        fail_msg: "Greengage cluster status utility is missing or not executable"

    - name: Check Greengage data directory
      ansible.builtin.stat:
        path: /data/greengage
