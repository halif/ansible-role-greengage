---
- name: Verify Greengage cluster configuration
  hosts: all
  become: true

  tasks:
    - name: Check gpinitsystem configuration
      ansible.builtin.stat:
        path: /home/gpadmin/gpinitsystem_config
      register: gpinitsystem_config

    - name: Verify gpinitsystem configuration file
      ansible.builtin.assert:
        that:
          - gpinitsystem_config.stat.exists
          - gpinitsystem_config.stat.isreg
          - gpinitsystem_config.stat.pw_name == 'gpadmin'
          - gpinitsystem_config.stat.gr_name == 'gpadmin'
          - gpinitsystem_config.stat.mode == '0600'
        fail_msg: >-
          The gpinitsystem configuration file is missing or has
          incorrect ownership or permissions.

    - name: Read gpinitsystem configuration
      ansible.builtin.slurp:
        src: /home/gpadmin/gpinitsystem_config
      register: gpinitsystem_config_content

    - name: Decode gpinitsystem configuration
      ansible.builtin.set_fact:
        gpinitsystem_config_text: >-
          {{ gpinitsystem_config_content.content | b64decode }}

    - name: Verify cluster name and master settings
      ansible.builtin.assert:
        that:
          - "'ARRAY_NAME=\"greengage\"' in gpinitsystem_config_text"
          - >-
            ('MASTER_HOSTNAME="' ~ ansible_facts.hostname ~ '"')
            in gpinitsystem_config_text
          - >-
            'MASTER_DIRECTORY="/data/greengage/master"'
            in gpinitsystem_config_text
          - "'MASTER_PORT=5432' in gpinitsystem_config_text"
        fail_msg: "Greengage cluster or master settings are incorrect."

    - name: Verify segment settings
      ansible.builtin.assert:
        that:
          - "'SEG_PREFIX=gpseg' in gpinitsystem_config_text"
          - "'PORT_BASE=10000' in gpinitsystem_config_text"
          - >-
            'declare -a DATA_DIRECTORY=( /data/greengage/primary )'
            in gpinitsystem_config_text
        fail_msg: "Greengage segment settings are incorrect."

    - name: Verify initialization settings
      ansible.builtin.assert:
        that:
          - "'TRUSTED_SHELL=ssh' in gpinitsystem_config_text"
          - "'CHECK_POINT_SEGMENTS=8' in gpinitsystem_config_text"
          - "'ENCODING=UNICODE' in gpinitsystem_config_text"
        fail_msg: "Greengage initialization settings are incorrect."
