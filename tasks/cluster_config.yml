---
- name: Validate Greengage cluster configuration
  ansible.builtin.import_tasks: validate_cluster_config.yml

- name: Create Greengage initialization configuration
  ansible.builtin.template:
    src: gpinitsystem_config.j2
    dest: "{{ greengage_gpinitsystem_config }}"
    owner: "{{ greengage_gpadmin_user }}"
    group: "{{ greengage_gpadmin_group }}"
    mode: "0600"
  become: true
