---
- name: Validate Greengage master inventory group
  ansible.builtin.assert:
    that:
      - greengage_master_group in groups
      - groups[greengage_master_group] | length == 1
    fail_msg: >-
      Cluster mode requires exactly one host in the
      '{{ greengage_master_group }}' inventory group.

- name: Validate Greengage segment inventory group
  ansible.builtin.assert:
    that:
      - greengage_segments_group in groups
      - groups[greengage_segments_group] | length >= 1
    fail_msg: >-
      Cluster mode requires at least one host in the
      '{{ greengage_segments_group }}' inventory group.
