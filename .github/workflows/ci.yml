---
name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint

      - name: Run yamllint
        run: yamllint -c .config/yamllint.yml .

      - name: Run ansible-lint
        run: ansible-lint

  molecule:
    name: Molecule - Ubuntu 22.04
    runs-on: ubuntu-22.04
    needs: lint

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Molecule
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core molecule
          pip install "molecule-plugins[docker]"

      - name: Make role available to Ansible
        run: |
          mkdir -p ~/.ansible/roles/halif
          ln -s "$GITHUB_WORKSPACE" ~/.ansible/roles/halif/greengage

      - name: Run Molecule
        run: molecule test
