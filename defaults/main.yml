---
greengage_version: "6"
greengage_package_name: greengage6

greengage_apt_repository: >-
  deb [signed-by=/etc/apt/keyrings/greengagedb.gpg]
  https://greengagedb.org/repositories/ubuntu/22.04/x86_64
  greengagedb main

greengage_apt_key_url: https://greengagedb.org/repositories/gpg
greengage_apt_keyring: /etc/apt/keyrings/greengagedb.gpg
greengage_apt_repository_file: /etc/apt/sources.list.d/greengagedb.list
greengage_apt_repository_filename: greengagedb

greengage_apt_update_cache: true

greengage_manage_gpadmin: true
greengage_gpadmin_user: gpadmin
greengage_gpadmin_group: gpadmin
greengage_gpadmin_home: /home/gpadmin

greengage_manage_environment: true
greengage_environment_file: /home/gpadmin/.bashrc
greengage_path_script: /opt/greengagedb/greengage6/greengage_path.sh

# Greengage data directory
greengage_data_directory: /data/greengage
greengage_manage_data_directory: true
greengage_data_directory_owner: "{{ greengage_gpadmin_user }}"
greengage_data_directory_group: "{{ greengage_gpadmin_group }}"
greengage_data_directory_mode: "0700"

# Greengage cluster initialization
greengage_manage_cluster_initialization: false
greengage_cluster_name: "greengage"
greengage_master_data_directory: "/data/greengage/master"
greengage_segment_data_directory: "/data/greengage/primary"
greengage_mirror_data_directory: "/data/greengage/mirror"

# Greengage initialization configuration
greengage_gpinitsystem_config: /home/gpadmin/gpinitsystem_config
greengage_master_hostname: "{{ ansible_facts.hostname }}"
greengage_master_port: 5432
greengage_segment_count: 1
greengage_replication_mode: "mirrorless"
